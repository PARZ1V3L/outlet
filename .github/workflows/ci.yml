name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: sdk
      - run: npm run typecheck
        working-directory: sdk
      - run: npm test
        working-directory: sdk
      - run: npm run build
        working-directory: sdk

  # The README's quickstart, verbatim, against this checkout's tarball, in
  # the runner's own Chrome. No secrets, no network past the loopback. The
  # script says what it substitutes (the tarball's path for the package
  # name in the printed install line) and pins the bundler.
  quickstart:
    name: Quickstart as printed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - run: npm pack --ignore-scripts
        working-directory: sdk
      - run: node scripts/quickstart-as-printed.mjs
        working-directory: sdk

  # quickstart-python: the Python quickstart as printed. Its job goes here
  # in the same shape and rides the Python SDK session.
