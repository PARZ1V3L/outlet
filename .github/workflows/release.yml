name: Release

# Build and test without a publish credential. Only the finished tarball
# reaches the job that can publish through npm trusted publishing. A third
# job then writes the GitHub Release from the CHANGELOG entry, with the
# workflow token's contents: write and nothing else.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Tag must match sdk/package.json
        run: |
          want="v$(node -p "require('./sdk/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match sdk/package.json ($want)"
            exit 1
          fi
      - run: npm ci --ignore-scripts
        working-directory: sdk
      - run: npm run typecheck
        working-directory: sdk
      - run: npm test
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - run: npm pack --ignore-scripts
        working-directory: sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball
          path: sdk/useoutlet-sdk-*.tgz
          if-no-files-found: error

  publish:
    name: Publish @useoutlet/sdk
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: npm must support trusted publishing (11.5.1 or later)
        run: |
          have="$(npm --version)"
          echo "npm $have"
          if [ "$(printf '%s\n%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "npm $have is below 11.5.1"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarball
      # No checkout, dependency install or lifecycle scripts in this job.
      - run: npm publish ./useoutlet-sdk-*.tgz --provenance --access public --ignore-scripts

  release-notes:
    name: GitHub Release with the CHANGELOG entry
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The notes are this version's entry in sdk/CHANGELOG.md as written:
      # the paragraph that opens with the version and a colon, or a
      # "## version" section in the older shape. No entry, no release.
      - name: Create the GitHub Release with this version's CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            !found && index($0, v ": ") == 1 { found = 1; para = 1 }
            !found && ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next }
            found && para && $0 == "" { exit }
            found && !para && index($0, "## ") == 1 { exit }
            found { print }
          ' sdk/CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "sdk/CHANGELOG.md has no entry for $version"
            exit 1
          fi
          cat notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
